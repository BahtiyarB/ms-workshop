# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-workshop-travel-buddy
services:
    foundry-workshop-travel-buddy:
        project: src/foundry-workshop-travel-buddy
        host: azure.ai.agent
        language: python
        uses:
            - proj-default
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
            MCP_SERVER_LABEL: ${MCP_SERVER_LABEL}
            MCP_SERVER_URL: ${MCP_SERVER_URL}
            WORKSHOP_RESOURCE_PREFIX: ${WORKSHOP_RESOURCE_PREFIX}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            TravelBuddy is an Agent Framework hosted agent with local Python function tools for weather, local time, and currency, plus an OctoTrip Flights MCP connection for live flight search.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Travel Assistant
                - Function Tools
                - MCP Tools
            tool_declarations:
                - description: Returns mock destination weather for a city and optional date.
                  name: get_weather
                  parameters:
                    city: string
                    date: string | null
                - description: Returns the current local time for a destination city.
                  name: get_local_time
                  parameters:
                    city: string
                - description: Converts mock travel prices between USD, EUR, JPY, and GBP.
                  name: convert_currency
                  parameters:
                    amount: float
                    from_currency: string
                    to_currency: string
                - description: OctoTrip Flights MCP server for live flight search.
                  name: octotrip-flights
                  type: mcp
                  url: ${MCP_SERVER_URL}
        name: foundry-workshop-travel-buddy
        protocols:
            - protocol: responses
              version: 2.0.0
    proj-default:
        host: azure.ai.project
        endpoint: https://eclt-workshop-genai.services.ai.azure.com/api/projects/proj-default
infra:
    provider: microsoft.foundry
